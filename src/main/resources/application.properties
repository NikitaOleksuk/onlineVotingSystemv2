spring.application.name=OnlineVotingSystem

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/online_voting_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=OnlineVotingSystemSecretKey2024SuperLongKeyForSecurity
jwt.lifeTime=86400000

# Default admin credentials (created on startup if not exists)
app.default-admin.username=admin
app.default-admin.password=Admin123
app.default-admin.email=admin@voting.com

# Base URL for poll voting links
app.base-url=http://localhost:8080
